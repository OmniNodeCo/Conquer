name: Build

# Continuous integration for Conquer: Rule the Globe.
#
#   push to any branch   -> tests + web bundle + portable executables
#   pull request         -> the same, nothing is published
#   push to main         -> additionally the signed desktop installers
#   manual dispatch      -> everything, every platform
#
# Nothing here publishes. `release.yml` picks up the artifacts of the newest
# successful run of this workflow and turns them into a GitHub Release.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read package.json
        id: read
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  verify:
    name: Test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install test dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Logic, save and packaging tests
        run: npm test

      - name: Headless UI smoke test
        run: npm run test:ui

      - name: Upload rendered map frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tmp-shots/
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Web bundle
    needs: [version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the browser bundle
        run: npm run build:web

      - name: Check and archive the bundle
        working-directory: release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -s web/index.html
          test -s web/src/game/main.js
          tar -tzf "conquer-web-$VERSION.tar.gz" >/dev/null
          zip -qr "conquer-web-$VERSION.zip" web

      - uses: actions/upload-artifact@v4
        with:
          name: conquer-web
          path: |
            release/conquer-web-*.zip
            release/conquer-web-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  portable:
    name: Portable executables
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Single-file executables with an embedded runtime: no installer, no
      # dependencies on the target machine, built by cross-compiling Bun.
      - name: Fetch the Bun build tool
        run: npm run get:bun

      - name: Build portable executables
        run: npm run build:exe

      - name: Smoke-test the Linux executable
        run: |
          set -euo pipefail
          chmod +x release/*-linux-x64
          ./release/*-linux-x64 --no-open --port=5199 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          curl -fsS --retry-connrefused --retry 15 --retry-delay 1 http://127.0.0.1:5199/ -o "$RUNNER_TEMP/game.html"
          grep -q 'CONQUER' "$RUNNER_TEMP/game.html"
          curl -sf http://127.0.0.1:5199/src/game/main.js >/dev/null
          echo "portable executable served the game successfully"

      - uses: actions/upload-artifact@v4
        with:
          name: conquer-portable
          path: |
            release/*.exe
            release/*-linux-x64
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Installers (${{ matrix.name }})
    needs: verify
    # Installers take minutes per platform: build them for main and on demand.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact: conquer-windows-x64
            target: --win
          - name: macOS (arm64 + x64)
            os: macos-latest
            artifact: conquer-macos
            target: --mac
          - name: Linux (x64)
            os: ubuntu-latest
            artifact: conquer-linux-x64
            target: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        shell: bash
        env:
          # Do not expose one platform's signing credentials to another runner.
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK && 'true' || 'false' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # On macOS an unset link means no certificate; an empty link is still imported.
          if [[ -z "$CSC_LINK" ]]; then unset CSC_LINK; fi
          npx electron-builder ${{ matrix.target }} --publish never

      - name: Verify the Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNED: ${{ secrets.WIN_CSC_LINK && 'yes' || 'no' }}
        run: |
          if ($env:SIGNED -eq 'no') { Write-Host 'No Windows signing certificate configured.'; exit 0 }
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "Invalid signature on $($_.Name): $($sig.Status)" }
          }

      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        env:
          SIGNED: ${{ secrets.MAC_CSC_LINK && 'yes' || 'no' }}
          NOTARIZED: ${{ secrets.APPLE_ID && secrets.APPLE_APP_SPECIFIC_PASSWORD && secrets.APPLE_TEAM_ID && 'yes' || 'no' }}
        run: |
          if [[ "$SIGNED" == no ]]; then echo 'No macOS signing certificate configured.'; exit 0; fi
          for app in release/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            if [[ "$NOTARIZED" == yes ]]; then spctl --assess --type execute -vv "$app"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Summary
    needs: [version, verify, web, portable, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write the job summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Conquer: Rule the Globe $VERSION"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Test | ${{ needs.verify.result }} |"
            echo "| Web bundle | ${{ needs.web.result }} |"
            echo "| Portable executables | ${{ needs.portable.result }} |"
            echo "| Installers | ${{ needs.desktop.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
