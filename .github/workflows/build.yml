name: Build

# Tests on every push/PR. Pushes and manual runs also produce real desktop apps.
# Only main is signed; Release consumes these artifacts, never a browser launcher.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read package.json
        id: read
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  verify:
    name: Test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install test dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Logic, save and packaging tests
        run: npm test

      - name: Headless UI smoke test
        run: npm run test:ui

      - name: Upload rendered map frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tmp-shots/
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      SIGN_BUILD: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact: conquer-windows-x64
            target: --win
          - name: macOS (arm64 + x64)
            os: macos-latest
            artifact: conquer-macos
            target: --mac
          - name: Linux (x64)
            os: ubuntu-latest
            artifact: conquer-linux-x64
            target: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        shell: bash
        env:
          # Do not expose one platform's signing credentials to another runner.
          WIN_CSC_LINK: ${{ env.SIGN_BUILD == 'true' && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ env.SIGN_BUILD == 'true' && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ env.SIGN_BUILD == 'true' && runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ env.SIGN_BUILD == 'true' && runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.SIGN_BUILD == 'true' && runner.os == 'macOS' && secrets.MAC_CSC_LINK && 'true' || 'false' }}
          APPLE_ID: ${{ env.SIGN_BUILD == 'true' && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.SIGN_BUILD == 'true' && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.SIGN_BUILD == 'true' && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # On macOS an unset link means no certificate; an empty link is still imported.
          if [[ -z "$CSC_LINK" ]]; then unset CSC_LINK; fi
          npx electron-builder ${{ matrix.target }} --publish never

      - name: Verify Windows launchers use the GUI subsystem (not a console)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $apps = @(Get-Item 'release/Conquer-Portable-*.exe', 'release/Conquer-Setup-*.exe', 'release/win-unpacked/Conquer Rule the Globe.exe')
          if ($apps.Count -ne 3) { throw 'Expected the portable, installer and unpacked game' }
          foreach ($app in $apps) {
            $pe = [IO.BinaryReader]::new($app.OpenRead())
            try {
              $pe.BaseStream.Position = 0x3c
              $peOffset = $pe.ReadUInt32()
              $pe.BaseStream.Position = $peOffset + 24 + 68 # PE signature, COFF header, Subsystem field
              if ($pe.ReadUInt16() -ne 2) { throw "$($app.Name) is not a Windows GUI executable" }
            } finally { $pe.Dispose() }
          }

      - name: Launch the actual Windows portable executable
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: ./tools/smoke-windows-portable.ps1

      - name: Start a campaign from the packaged game offline
        timeout-minutes: 2
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            node_modules/.bin/electron tools/desktop-smoke.cjs release/win-unpacked/resources/app.asar
          else
            xvfb-run -a node_modules/.bin/electron --no-sandbox tools/desktop-smoke.cjs release/linux-unpacked/resources/app.asar
          fi

      - name: Verify the Windows signature
        if: runner.os == 'Windows' && env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SIGNED: ${{ secrets.WIN_CSC_LINK && 'yes' || 'no' }}
        run: |
          if ($env:SIGNED -eq 'no') { Write-Host 'No Windows signing certificate configured.'; exit 0 }
          $expectedPublisher = (Get-Content -Raw package.json | ConvertFrom-Json).build.win.signtoolOptions.publisherName
          Get-Item 'release/*.exe', 'release/win-unpacked/Conquer Rule the Globe.exe' | ForEach-Object {
            $sig = Get-AuthenticodeSignature -LiteralPath $_.FullName
            if ($sig.Status -ne 'Valid') { throw "Invalid signature on $($_.Name): $($sig.Status)" }
            $publisher = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($publisher -cne $expectedPublisher) { throw "Wrong signer on $($_.Name): expected '$expectedPublisher', got '$publisher'" }
          }

      - name: Verify the macOS signature
        if: runner.os == 'macOS' && env.SIGN_BUILD == 'true'
        env:
          SIGNED: ${{ secrets.MAC_CSC_LINK && 'yes' || 'no' }}
          NOTARIZED: ${{ secrets.APPLE_ID && secrets.APPLE_APP_SPECIFIC_PASSWORD && secrets.APPLE_TEAM_ID && 'yes' || 'no' }}
        run: |
          if [[ "$SIGNED" == no ]]; then echo 'No macOS signing certificate configured.'; exit 0; fi
          for app in release/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            if [[ "$NOTARIZED" == yes ]]; then spctl --assess --type execute -vv "$app"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Summary
    needs: [version, verify, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write the job summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Conquer: Rule the Globe $VERSION"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Test | ${{ needs.verify.result }} |"
            echo "| Installers | ${{ needs.desktop.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
