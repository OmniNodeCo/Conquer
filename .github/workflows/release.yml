name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to reuse or create (empty = v<version of the build>)'
        type: string
      run_id:
        description: 'Build run ID (empty = latest successful push or manual Build on main)'
        type: string
      draft:
        description: 'Draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Pre-release'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select a successful Build and its tag
        id: build
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          workflow="repos/$GH_REPO/actions/workflows/build.yml"
          if [[ -z "$RUN_ID" ]]; then
            # The API returns newest first. Check both kinds of full builds, never PRs.
            for event in push workflow_dispatch; do
              id=$(gh api "$workflow/runs?branch=main&event=$event&status=success&per_page=1" --jq '.workflow_runs[].id')
              if (( ${id:-0} > ${RUN_ID:-0} )); then RUN_ID=$id; fi
            done
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Expected the numeric ID of a successful Build on main. Run Build first.'
            exit 1
          fi

          # A supplied ID must meet the same trust and completeness criteria as the default.
          workflow_id=$(gh api "$workflow" --jq '.id')
          run=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")
          if ! sha=$(jq -er --arg repo "$GH_REPO" --argjson workflow "$workflow_id" '
            select(.workflow_id == $workflow and .conclusion == "success" and
                   .head_repository.full_name == $repo and .head_branch == "main" and
                   (.event == "push" or .event == "workflow_dispatch")) | .head_sha' <<< "$run"); then
            echo "::error::Run $RUN_ID is not a successful Build of main in $GH_REPO."
            exit 1
          fi

          tag=$INPUT_TAG
          if [[ -z "$tag" ]]; then
            version=$(gh api "repos/$GH_REPO/contents/package.json?ref=$sha" --jq '.content | @base64d | fromjson | .version')
            tag="v${version:?missing package version}"
          fi
          if [[ "$tag" == -* ]] || ! git check-ref-format "refs/tags/$tag"; then
            echo '::error::Invalid release tag.'
            exit 1
          fi
          printf 'run_id=%s\nsha=%s\ntag=%s\n' "$RUN_ID" "$sha" "$tag" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from that Build (not this run)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          pattern: conquer-*
          path: artifacts

      - name: Stage release assets and checksums
        run: |
          set -euo pipefail
          mkdir dist
          # Refuse to publish a partial release if artifacts expired or were removed.
          for group in conquer-web conquer-portable conquer-windows-x64 conquer-macos conquer-linux-x64; do
            for asset in "artifacts/$group/"*; do
              if [[ ! -s "$asset" || ! -f "$asset" || -e "dist/${asset##*/}" ]]; then
                echo "::error::Missing, empty or duplicate build asset: $asset"
                exit 1
              fi
              mv -- "$asset" dist/
            done
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)

      - name: Create or refresh the release
        env:
          TAG: ${{ steps.build.outputs.tag }}
          SHA: ${{ steps.build.outputs.sha }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
          DRAFT: ${{ inputs.draft || false }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          set -euo pipefail
          notes="Built from commit $SHA by [Build run $RUN_ID]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$RUN_ID)."
          options=(--title "Conquer: Rule the Globe $TAG" --notes "$notes" --draft="$DRAFT" --prerelease="$PRERELEASE")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" "${options[@]}"
          else
            # GitHub preserves an existing tag; --target sets the commit ONLY for a new tag.
            gh release create "$TAG" dist/* --target "$SHA" "${options[@]}"
          fi
